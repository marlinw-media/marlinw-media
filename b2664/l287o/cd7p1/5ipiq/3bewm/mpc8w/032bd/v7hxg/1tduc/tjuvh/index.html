<style>
#splash{position:fixed;inset:0;z-index:999;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 38%,#33267a 0%,#17143a 45%,#0b0c1c 80%);color:#f3f4ff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;clip-path:circle(150% at 50% 42%);transition:clip-path .75s cubic-bezier(.7,0,.3,1),opacity .75s}
#splash.out{clip-path:circle(0% at 50% 42%);opacity:.6}
#splash .sp-grid{position:absolute;inset:-20%;background-image:linear-gradient(rgba(124,92,255,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(124,92,255,.10) 1px,transparent 1px);background-size:34px 34px;transform:perspective(500px) rotateX(55deg) translateY(28%);animation:spGrid 3s linear infinite;mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 70%)}
#splash .sp-bits{position:absolute;inset:0;pointer-events:none}
#splash .sp-bits span{position:absolute;bottom:-30px;font:800 13px ui-monospace,Menlo,monospace;color:#8f7dff;opacity:0;animation:spBit linear infinite}
#splash .sp-stage{position:relative;width:220px;height:220px;display:grid;place-items:center}
#splash .sp-ring{position:absolute;border-radius:50%;border:1.5px dashed rgba(201,195,255,.35)}
#splash .sp-r1{inset:14px;animation:spSpin 7s linear infinite}
#splash .sp-r2{inset:-8px;border-style:dotted;border-color:rgba(255,95,162,.35);animation:spSpin 11s linear infinite reverse}
#splash .sp-ring i{position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:4px;background:#ffb347;box-shadow:0 0 12px #ffb347}
#splash .sp-r1 i:nth-child(2){top:auto;bottom:-7px;background:#4cc9ff;box-shadow:0 0 12px #4cc9ff}
#splash .sp-r2 i{background:#ff5fa2;box-shadow:0 0 12px #ff5fa2;border-radius:50%;width:10px;height:10px;margin-left:-5px;top:-5px}
#splash .sp-glow{position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,255,.55),transparent 65%);animation:spPulse 1.6s ease-in-out infinite}
#splash .spchip{position:relative;width:120px;height:120px;overflow:visible;animation:spPop .7s cubic-bezier(.3,1.7,.5,1) both,spBob 1.1s cubic-bezier(.3,1.5,.5,1) .7s infinite alternate}
#splash .sp-pin{animation:spPin 1.2s ease-in-out infinite}#splash .sp-pin:nth-child(2n){animation-delay:.3s}#splash .sp-pin:nth-child(3n){animation-delay:.6s}
#splash .sp-eye{animation:spBlink 3s infinite;transform-origin:center 31px}
#splash .sp-spark{position:absolute;font-size:16px;opacity:0;animation:spSpark 1.8s ease-in-out infinite}
#splash h1{margin:18px 0 0;font-size:38px;font-weight:900;letter-spacing:-.02em;display:flex;gap:1px}
#splash h1 b{display:inline-block;background:linear-gradient(135deg,#a48bff,#ff5fa2 55%,#ffb347);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;transform:translateY(14px) scale(.8);animation:spLetter .5s cubic-bezier(.3,1.6,.5,1) forwards,spShine 2.4s linear 1s infinite}
#splash .sp-tag{margin-top:4px;font-size:12px;font-weight:800;letter-spacing:.22em;color:#8d88c4;text-transform:uppercase;opacity:0;animation:spFade .5s .7s forwards}
#splash .sp-bar{margin-top:22px;width:250px;height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
#splash .sp-bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#7c5cff,#ff5fa2,#ffb347);box-shadow:0 0 14px rgba(255,95,162,.7);transition:width .25s ease-out}
#splash .sp-row{display:flex;justify-content:space-between;width:250px;margin-top:8px;font-size:12.5px;font-weight:700;color:#a9adcf}
#splash .sp-row b{color:#ffd166;font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:8px}#splash .sp-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@keyframes spGrid{to{background-position:0 34px}}
@keyframes spBit{0%{opacity:0;transform:translateY(0)}15%{opacity:.75}100%{opacity:0;transform:translateY(-110vh)}}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spPulse{50%{transform:scale(1.15);opacity:.7}}
@keyframes spPop{from{transform:scale(0) rotate(-25deg)}to{transform:scale(1) rotate(0)}}
@keyframes spBob{from{transform:translateY(4px) scale(1,.97)}to{transform:translateY(-9px) scale(.98,1.03)}}
@keyframes spPin{50%{fill:#ffd166}}
@keyframes spBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes spSpark{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.1) rotate(20deg)}}
@keyframes spLetter{to{opacity:1;transform:none}}
@keyframes spShine{to{background-position:300% 0}}
@keyframes spFade{to{opacity:1}}
</style>
