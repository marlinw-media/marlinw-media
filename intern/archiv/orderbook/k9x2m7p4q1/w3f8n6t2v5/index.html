<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Getränke</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
<style>
  .shop-wrap { max-width: 960px; margin: 0 auto; padding: 48px 24px 96px; transition: padding-bottom 200ms ease; }
  .shop-head { margin-bottom: 28px; }
  .shop-head h1 { font-size: clamp(26px, 5vw, 38px); }
  .shop-head p { font-size: 14.5px; }

  .shop-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .drink-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px;
    display: grid;
    grid-template-columns: 72px 1fr;
    grid-template-areas:
      "art name"
      "note note"
      "btn btn";
    column-gap: 14px;
    row-gap: 10px;
    align-items: center;
  }
  .drink-art {
    grid-area: art;
    width: 72px;
    height: 72px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-alt);
    overflow: hidden;
  }
  .drink-art svg { width: 74%; height: 90%; }
  .drink-card h3 { grid-area: name; font-size: 15px; margin: 0; line-height: 1.25; }
  .drink-card .add-btn { grid-area: btn; width: 100%; }
  .drink-note {
    grid-area: note;
    background: var(--accent);
    color: #fff;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 999px;
    text-align: center;
  }

  /* topping modal */
  .topping-modal {
    position: fixed;
    inset: 0;
    z-index: 80;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(5,5,6,0.72);
    opacity: 0;
    pointer-events: none;
    transition: opacity 180ms ease;
  }
  .topping-modal.open { opacity: 1; pointer-events: auto; }
  .tm-panel {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg);
    padding: 26px;
    width: 100%;
    max-width: 360px;
  }
  .tm-panel h3 { margin: 0 0 16px; font-size: 18px; }
  .tm-opt {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
    cursor: pointer;
  }
  .tm-opt input { width: 18px; height: 18px; accent-color: var(--accent); }
  .tm-actions { display: flex; gap: 10px; margin-top: 20px; }
  .tm-actions .btn { flex: 1; }

  /* cart */
  .cart {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--border-strong);
    z-index: 50;
    transform: translateY(calc(100% - 58px));
    transition: transform 260ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .cart.open { transform: translateY(0); }
  .cart-toggle {
    width: 100%;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: none;
    border: 0;
    cursor: pointer;
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
  }
  .cart-toggle .count {
    background: var(--accent);
    color: #fff;
    border-radius: 999px;
    min-width: 24px;
    height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    padding: 0 7px;
  }
  .cart-body {
    max-width: 960px;
    margin: 0 auto;
    padding: 6px 24px 24px;
  }
  #cart-lines {
    max-height: 168px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .cart-empty { color: var(--text-faint); font-size: 14px; padding: 12px 0 20px; }
  .cart-line {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .cart-line .cl-name { flex: 1; font-size: 14.5px; font-weight: 500; }
  .cart-line .cl-name small { display: block; font-weight: 400; color: var(--text-faint); font-size: 12.5px; margin-top: 2px; }
  .qty { display: flex; align-items: center; gap: 4px; }
  .qty button {
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  .qty .val { min-width: 26px; text-align: center; font-weight: 600; font-size: 14px; }
  .cl-remove {
    background: none; border: 0;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 13px;
    text-decoration: underline;
  }
  .cl-remove:hover { color: var(--accent); }
  .cart-actions { padding-top: 18px; }
  .order-status {
    margin-top: 14px;
    font-size: 14px;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    display: none;
  }
  .order-status.show { display: block; }
  .order-status.ok { background: rgba(34,197,94,0.12); color: #22c55e; }
  .order-status.err { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }

  @media (max-width: 620px) {
    .shop-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="shop-wrap">
  <div class="shop-head">
    <h1>Bestellliste</h1>
    <p>Anklicken, Menge einstellen, bestellen — kommt dann hoch.</p>
  </div>

  <div class="shop-grid" id="shop-grid"></div>
</div>

<div class="topping-modal" id="topping-modal">
  <div class="tm-panel">
    <h3 id="tm-title">Belegen</h3>
    <div id="tm-options"></div>
    <div class="tm-actions">
      <button class="btn btn-ghost btn-sm" id="tm-cancel" type="button">Abbrechen</button>
      <button class="btn btn-accent btn-sm" id="tm-add" type="button">Hinzufügen</button>
    </div>
  </div>
</div>

<div class="cart" id="cart">
  <button class="cart-toggle" id="cart-toggle" type="button">
    <span>Warenkorb</span>
    <span class="count" id="cart-count">0</span>
  </button>
  <div class="cart-body">
    <div id="cart-lines"></div>
    <div class="cart-actions">
      <button class="btn btn-accent btn-block" id="order-btn" type="button">Bestellen</button>
      <div class="order-status" id="order-status"></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var ORDER_ENDPOINT = 'https://formsubmit.co/ajax/marlinw.media@gmail.com';

  function bottleSVG(fill, bubbles) {
    var b = bubbles
      ? '<circle cx="50" cy="72" r="3" fill="#fff" opacity=".55"/><circle cx="60" cy="92" r="2.4" fill="#fff" opacity=".5"/><circle cx="45" cy="106" r="2" fill="#fff" opacity=".45"/>'
      : '';
    return '<svg viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">' +
      '<rect x="42" y="6" width="16" height="12" rx="2" fill="#c9ccd2"/>' +
      '<path d="M38 20h24c2 0 3 3 3 6l4 10c2 5 3 9 3 16v78c0 6-4 10-10 10H38c-6 0-10-4-10-10V52c0-7 1-11 3-16l4-10c0-3 1-6 3-6z" fill="' + fill + '"/>' +
      '<rect x="30" y="72" width="40" height="32" rx="4" fill="#fff" opacity=".9"/>' + b +
      '</svg>';
  }

  function pouchSVG(fill, accent) {
    return '<svg viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">' +
      '<rect x="70" y="0" width="6" height="46" rx="3" fill="#f0b429"/>' +
      '<path d="M18 26h84c4 0 7 3 7 7v96c0 4-3 7-7 7H18c-4 0-7-3-7-7V33c0-4 3-7 7-7z" fill="' + fill + '"/>' +
      '<rect x="24" y="52" width="72" height="52" rx="6" fill="#fff" opacity=".92"/>' +
      '<rect x="24" y="112" width="72" height="12" rx="4" fill="' + accent + '"/>' +
      '</svg>';
  }

  function chipsSVG() {
    return '<svg viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M30 14l6 6-6 6 6 6-6 6v82a6 6 0 0 0 6 6h48a6 6 0 0 0 6-6V44l-6-6 6-6-6-6 6-6H30z" fill="#e0a63c"/>' +
      '<rect x="38" y="52" width="44" height="46" rx="5" fill="#fff" opacity=".9"/>' +
      '<path d="M50 66l16 4-6 14z" fill="#e0a63c"/>' +
      '</svg>';
  }

  function popcornSVG() {
    return '<svg viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">' +
      '<g fill="#f4d35e">' +
      '<circle cx="42" cy="42" r="13"/><circle cx="62" cy="34" r="14"/><circle cx="82" cy="44" r="12"/>' +
      '<circle cx="52" cy="52" r="12"/><circle cx="74" cy="52" r="11"/></g>' +
      '<path d="M34 56h52l-8 74a6 6 0 0 1-6 5H48a6 6 0 0 1-6-5z" fill="#d64545"/>' +
      '<rect x="46" y="62" width="8" height="66" fill="#fff" opacity=".85"/>' +
      '<rect x="66" y="62" width="8" height="66" fill="#fff" opacity=".85"/>' +
      '</svg>';
  }

  function sandwichSVG() {
    return '<svg viewBox="0 0 140 150" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M20 110L70 30l50 80z" fill="#e8c98d"/>' +
      '<path d="M30 104L70 40l40 64z" fill="#6db26d"/>' +
      '<path d="M40 98L70 52l30 46z" fill="#d96b6b"/>' +
      '<path d="M50 92L70 62l20 30z" fill="#f2e6c9"/>' +
      '</svg>';
  }

  function muesliSVG() {
    return '<svg viewBox="0 0 140 150" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M18 62h104a52 52 0 0 1-52 52 52 52 0 0 1-52-52z" fill="#e8e2d4"/>' +
      '<ellipse cx="70" cy="62" rx="52" ry="14" fill="#c9a35b"/>' +
      '<g fill="#8a5a34">' +
      '<circle cx="52" cy="60" r="5"/><circle cx="70" cy="64" r="5"/><circle cx="88" cy="59" r="5"/>' +
      '<rect x="60" y="52" width="12" height="5" rx="2" transform="rotate(20 66 54)"/>' +
      '<rect x="78" y="66" width="12" height="5" rx="2" transform="rotate(-15 84 68)"/>' +
      '</g>' +
      '<g fill="#d64545"><circle cx="46" cy="66" r="3.5"/><circle cx="96" cy="66" r="3.5"/></g>' +
      '</svg>';
  }

  function coffeeSVG() {
    return '<svg viewBox="0 0 140 150" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M40 20c0 6-6 8-6 14s6 8 6 14" fill="none" stroke="#b7bcc4" stroke-width="4" stroke-linecap="round"/>' +
      '<path d="M60 20c0 6-6 8-6 14s6 8 6 14" fill="none" stroke="#b7bcc4" stroke-width="4" stroke-linecap="round"/>' +
      '<path d="M28 58h72v34a30 30 0 0 1-30 30H58a30 30 0 0 1-30-30z" fill="#8a5a44"/>' +
      '<path d="M100 66h10a14 14 0 0 1 0 28h-10z" fill="none" stroke="#8a5a44" stroke-width="8"/>' +
      '<rect x="28" y="58" width="72" height="10" fill="#f2e6c9"/>' +
      '</svg>';
  }

  var PRODUCTS = [
    { id: 'wasser-still', name: 'Stilles Wasser', art: bottleSVG('#bfe3f5', false) },
    { id: 'wasser-medium', name: 'Medium Wasser', art: bottleSVG('#6db8e0', true) },
    { id: 'cs-multivitamin', name: 'Capri-Sun Multivitamin', art: pouchSVG('#f59e0b', '#c2410c') },
    { id: 'cs-fairydrink', name: 'Capri-Sun Fairy Drink', art: pouchSVG('#ec4899', '#9d174d') },
    { id: 'cs-safarifruits', name: 'Capri-Sun Safari Fruits', art: pouchSVG('#22c55e', '#15803d') },
    { id: 'kaffee', name: 'Kaffee', art: coffeeSVG() },
    { id: 'muesli', name: 'Müsli', art: muesliSVG() },
    { id: 'chips', name: 'Chips (Zufallssorte)', art: chipsSVG() },
    { id: 'popcorn', name: 'Popcorn', art: popcornSVG() },
    {
      id: 'sandwich', name: 'Sandwich', art: sandwichSVG(),
      note: 'Achtung: erhöhte Bearbeitungszeit',
      options: ['Salami', 'Butter', 'Senf', 'Spezialsauce', 'Gouda', 'verschiedene Käsesorten']
    }
  ];

  var STORE_KEY = 'mw-drinks-cart';
  var cart = {};
  try { cart = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { cart = {}; }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(cart)); } catch (e) {} }

  function baseId(key) { return key.split('::')[0]; }
  function toppingsOf(key) { var t = key.split('::')[1]; return t ? t.split('|') : []; }
  function keyFor(id, toppings) { return toppings.length ? id + '::' + toppings.join('|') : id; }
  function productOf(key) { var b = baseId(key); return PRODUCTS.find(function (x) { return x.id === b; }); }
  function lineText(key) {
    var p = productOf(key);
    var name = p ? p.name : baseId(key);
    var t = toppingsOf(key);
    return t.length ? name + ' mit ' + t.join(', ') : name;
  }

  var grid = document.getElementById('shop-grid');
  var cartEl = document.getElementById('cart');
  var cartLines = document.getElementById('cart-lines');
  var cartCount = document.getElementById('cart-count');
  var orderStatus = document.getElementById('order-status');
  var shopWrap = document.querySelector('.shop-wrap');

  // keep enough space below the list so the last product is always
  // scrollable above the cart, whether the cart is open or collapsed
  function syncBottomSpace() {
    var h = cartEl.classList.contains('open') ? cartEl.offsetHeight : 58;
    shopWrap.style.paddingBottom = (h + 32) + 'px';
  }
  window.addEventListener('resize', syncBottomSpace);

  PRODUCTS.forEach(function (p) {
    var card = document.createElement('div');
    card.className = 'drink-card';
    card.innerHTML =
      '<div class="drink-art">' + p.art + '</div>' +
      '<h3>' + p.name + '</h3>' +
      (p.note ? '<div class="drink-note">' + p.note + '</div>' : '') +
      '<button class="btn btn-ghost btn-sm add-btn" data-add="' + p.id + '">In den Warenkorb</button>';
    grid.appendChild(card);
  });

  function addToCart(key) {
    cart[key] = (cart[key] || 0) + 1;
    save();
    render();
    cartEl.classList.add('open');
    syncBottomSpace();
  }

  /* ---- topping modal ---- */
  var modal = document.getElementById('topping-modal');
  var modalTitle = document.getElementById('tm-title');
  var modalOptions = document.getElementById('tm-options');
  var pendingProduct = null;

  function openToppingModal(product) {
    pendingProduct = product;
    modalTitle.textContent = product.name + ' belegen';
    modalOptions.innerHTML = product.options.map(function (o, i) {
      return '<label class="tm-opt"><input type="checkbox" value="' + o + '" id="tm-o' + i + '">' + o + '</label>';
    }).join('');
    modal.classList.add('open');
  }
  function closeToppingModal() {
    modal.classList.remove('open');
    pendingProduct = null;
  }

  document.getElementById('tm-cancel').addEventListener('click', closeToppingModal);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeToppingModal(); });
  document.getElementById('tm-add').addEventListener('click', function () {
    if (!pendingProduct) return;
    var chosen = Array.from(modalOptions.querySelectorAll('input:checked')).map(function (c) { return c.value; });
    addToCart(keyFor(pendingProduct.id, chosen));
    closeToppingModal();
  });

  grid.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-add]');
    if (!btn) return;
    var product = PRODUCTS.find(function (x) { return x.id === btn.dataset.add; });
    if (!product) return;
    if (product.options) { openToppingModal(product); return; }
    addToCart(product.id);
  });

  function totalItems() {
    return Object.keys(cart).reduce(function (s, k) { return s + cart[k]; }, 0);
  }

  function render() {
    cartCount.textContent = totalItems();
    var keys = Object.keys(cart).filter(function (k) { return cart[k] > 0; });
    if (!keys.length) {
      cartLines.innerHTML = '<div class="cart-empty">Noch nichts im Warenkorb.</div>';
      return;
    }
    cartLines.innerHTML = '';
    keys.forEach(function (key) {
      var p = productOf(key);
      var t = toppingsOf(key);
      var line = document.createElement('div');
      line.className = 'cart-line';
      line.innerHTML =
        '<span class="cl-name">' + (p ? p.name : baseId(key)) +
          (t.length ? '<small>mit ' + t.join(', ') + '</small>' : '') +
        '</span>' +
        '<span class="qty">' +
          '<button data-dec="' + key + '" aria-label="weniger">–</button>' +
          '<span class="val">' + cart[key] + '</span>' +
          '<button data-inc="' + key + '" aria-label="mehr">+</button>' +
        '</span>' +
        '<button class="cl-remove" data-del="' + key + '">entfernen</button>';
      cartLines.appendChild(line);
    });
  }

  cartLines.addEventListener('click', function (e) {
    var t = e.target;
    var k = t.dataset.inc || t.dataset.dec || t.dataset.del;
    if (!k) return;
    if (t.dataset.inc) { cart[k]++; }
    else if (t.dataset.dec) { cart[k] = Math.max(0, cart[k] - 1); if (!cart[k]) delete cart[k]; }
    else { delete cart[k]; }
    save();
    render();
    syncBottomSpace();
  });

  document.getElementById('cart-toggle').addEventListener('click', function () {
    cartEl.classList.toggle('open');
    syncBottomSpace();
  });

  document.getElementById('order-btn').addEventListener('click', async function () {
    var btn = this;
    var keys = Object.keys(cart).filter(function (k) { return cart[k] > 0; });
    orderStatus.className = 'order-status';
    if (!keys.length) {
      orderStatus.textContent = 'Der Warenkorb ist leer.';
      orderStatus.classList.add('show', 'err');
      syncBottomSpace();
      return;
    }

    var lines = keys.map(function (k) { return cart[k] + '× ' + lineText(k); });

    btn.disabled = true;
    var original = btn.textContent;
    btn.textContent = 'Wird gesendet …';

    var payload = {
      _subject: 'Bestellung Getränke',
      _template: 'table',
      Bestellung: lines.join('\n'),
      'Positionen gesamt': String(totalItems())
    };

    try {
      var res = await fetch(ORDER_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('failed');
      orderStatus.textContent = 'Bestellung gesendet: ' + lines.join(', ') + '.';
      orderStatus.classList.add('show', 'ok');
      cart = {};
      save();
      render();
    } catch (err) {
      orderStatus.textContent = 'Konnte nicht gesendet werden. Nochmal versuchen.';
      orderStatus.classList.add('show', 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = original;
      syncBottomSpace();
    }
  });

  render();
  syncBottomSpace();
})();
</script>
</body>
</html>
