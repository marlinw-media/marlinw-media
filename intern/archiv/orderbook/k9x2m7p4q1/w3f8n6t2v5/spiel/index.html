<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Hauptspiel</title>
<style>
  :root {
    --sky: #bfe8f5;
    --wood: #8a5a3a;
    --room: #f6e6c8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    font-family: 'Baloo 2', 'Comic Sans MS', system-ui, sans-serif;
    background: #1a2e1a;
  }
  #app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }

  .rotate-overlay {
    position: fixed; inset: 0; background: #000; color: #fff;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; z-index: 999; text-align: center; padding: 24px;
  }
  @media (orientation: portrait) { .rotate-overlay { display: flex; } #app { display: none; } }
  .rotate-icon { font-size: 54px; animation: rotHint 1.6s ease-in-out infinite; }
  @keyframes rotHint { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
  .rotate-overlay p { font-size: 15px; color: #cbd5e1; max-width: 32ch; margin: 0; }

  .fs-btn {
    position: fixed; top: 10px; right: 10px; z-index: 60;
    border: none; border-radius: 10px;
    background: rgba(0,0,0,.35); color: #fff;
    font-size: 13px; padding: 8px 12px;
  }

  .scene { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; }
  .scene.active { display: flex; }

  /* ---------- Außenwelt ---------- */
  #outdoor-stage { position: relative; }
  .map { display: grid; position: relative; overflow: hidden; }
  .tile { position: relative; }
  .tile.grass {
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,.12), transparent 55%),
      linear-gradient(160deg, #7bc96f, #5fae55 60%, #4d9a44);
  }
  .tile.grass::after {
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(rgba(60,120,50,.35) 8%, transparent 9%),
      radial-gradient(rgba(90,160,70,.3) 6%, transparent 7%);
    background-size: 60% 60%, 40% 40%;
    background-position: 15% 70%, 70% 20%;
  }
  .tile.fence { background: linear-gradient(160deg, #4a7a3f, #3c6534); }
  .tile.puddle {
    background: radial-gradient(ellipse at center, #8fd8ea 0%, #6fc0d8 60%, transparent 75%),
      linear-gradient(160deg, #7bc96f, #5fae55 60%, #4d9a44);
  }

  .fence-post {
    position: absolute; pointer-events: none;
  }
  .tree-sprite, .house-sprite, .river-svg, .flower-sprite { position: absolute; pointer-events: none; }

  .leash-svg { position: absolute; inset: 0; pointer-events: none; z-index: 3; overflow: visible; }

  .sprite { position: absolute; transition: left .17s ease-out, top .17s ease-out; }
  .sprite svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .player-sprite { z-index: 5; }
  .dog-sprite { z-index: 4; transition: left .17s ease-out, top .17s ease-out, transform .3s ease; }
  .dog-sprite.shake { animation: shakeDog .5s ease; }
  @keyframes shakeDog { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-12deg); } 40% { transform: rotate(10deg); } 60% { transform: rotate(-8deg); } 80% { transform: rotate(6deg); } }
  .dog-sprite.digging { animation: digBob .35s ease-in-out infinite; }
  @keyframes digBob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(4px) rotate(-6deg); } }

  .stick-sprite {
    position: absolute; z-index: 6; pointer-events: none;
    width: 20px; height: 20px;
    transition: left .5s cubic-bezier(.3,.6,.4,1), top .5s cubic-bezier(.3,.6,.4,1);
  }

  .toast {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.94); color: #3f6b3d; font-weight: 700; font-size: 13px;
    padding: 7px 16px; border-radius: 999px; z-index: 30;
    opacity: 0; transition: opacity .25s, transform .25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }

  .joystick { position: fixed; left: 22px; bottom: 22px; z-index: 40; }
  .joy-base {
    width: 108px; height: 108px; border-radius: 50%;
    background: rgba(255,255,255,.25);
    border: 3px solid rgba(255,255,255,.5);
    position: relative;
    touch-action: none;
  }
  .joy-knob {
    position: absolute; left: 50%; top: 50%;
    width: 46px; height: 46px; margin: -23px 0 0 -23px;
    border-radius: 50%;
    background: rgba(255,255,255,.9);
    box-shadow: 0 4px 8px rgba(0,0,0,.3);
  }

  .action-buttons {
    position: fixed; right: 18px; bottom: 22px; z-index: 40;
    display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
  }
  .action-btn {
    border: none; border-radius: 999px;
    background: rgba(255,255,255,.85);
    color: #3f6b3d; font-weight: 700; font-size: 13px;
    padding: 12px 18px;
    box-shadow: 0 4px 0 rgba(0,0,0,.2);
    display: flex; align-items: center; gap: 6px;
  }
  .action-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .action-btn:disabled { opacity: .45; }

  /* ---------- Haus-Innenraum ---------- */
  #scene-house { flex-direction: column; background: var(--room); }
  .room-bg { position: absolute; inset: 0; overflow: hidden; }
  .room-floor {
    position: absolute; left: 0; right: 0; bottom: 0; top: 42%;
    background: repeating-linear-gradient(90deg, #d9b273 0 40px, #cfa565 40px 42px);
  }
  .room-wall {
    position: absolute; left: 0; right: 0; top: 0; height: 42%;
    background: linear-gradient(180deg, #f3e0bd, #e8cf9e);
  }
  .window {
    position: absolute; top: 8%; left: 6%;
    width: 90px; height: 62px;
    background: linear-gradient(180deg, var(--sky), #8fd0e8);
    border: 7px solid #fff; border-radius: 8px;
  }
  .window::after { content: "☁️"; position: absolute; font-size: 18px; top: 8px; left: 10px; }
  .picture-frame {
    position: absolute; top: 10%; right: 8%;
    width: 60px; height: 46px; background: #fff; border: 5px solid #a9744a; border-radius: 4px;
  }
  .picture-frame::after { content:"🐾"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:20px; }

  .couch {
    position: absolute; left: 5%; bottom: 8%;
    width: 190px; height: 90px;
  }
  .basket {
    position: absolute; right: 8%; bottom: 7%;
    width: 130px; height: 90px;
  }
  .drop-target.hover .basket-svg, .drop-target.hover .couch-svg { filter: brightness(1.15) drop-shadow(0 0 8px gold); }

  .dog-big { position: absolute; left: 50%; bottom: 26%; transform: translateX(-50%); width: 170px; height: 130px; z-index: 3; touch-action: none; }
  .dog-big svg { width: 100%; height: 100%; overflow: visible; }
  .dog-big.happy { animation: happyBounce .5s ease; }
  .dog-big.resting { width: 110px; height: 84px; }
  @keyframes happyBounce { 0%,100% { transform: translateX(-50%) scale(1); } 40% { transform: translateX(-50%) scale(1.12) rotate(-4deg); } 70% { transform: translateX(-50%) scale(1.05) rotate(3deg); } }
  .zzz { position: absolute; font-size: 20px; animation: zzzFloat 2s ease-in-out infinite; pointer-events: none; }
  @keyframes zzzFloat { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-24px); } }

  .hearts-layer { position: absolute; inset: 0; pointer-events: none; z-index: 8; overflow: hidden; }
  .heart-fx { position: absolute; font-size: 22px; animation: heartUp 1s ease-out forwards; }
  @keyframes heartUp { 0% { opacity: 0; transform: translateY(0) scale(.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-90px) scale(1.2); } }
  .dust-fx { position: absolute; font-size: 16px; animation: dustPop .6s ease-out forwards; }
  @keyframes dustPop { 0% { opacity: 0; transform: translate(0,0) scale(.5); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx,10px),-20px) scale(1); } }

  .stat-bars {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; background: rgba(255,255,255,.75); padding: 8px 14px; border-radius: 999px; z-index: 10;
  }
  .stat { display: flex; align-items: center; gap: 5px; font-size: 13px; }
  .stat-track { width: 52px; height: 9px; border-radius: 999px; background: rgba(0,0,0,.15); overflow: hidden; }
  .stat-fill { height: 100%; background: linear-gradient(90deg,#4ade80,#22c55e); transition: width .3s ease; }

  .items-tray { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; z-index: 15; }
  .item {
    width: 56px; height: 56px; border-radius: 16px; background: #fff;
    box-shadow: 0 6px 0 rgba(0,0,0,.15);
    display: flex; align-items: center; justify-content: center; font-size: 26px;
    cursor: grab; touch-action: none;
  }
  .item.dragging { position: fixed; z-index: 999; pointer-events: none; box-shadow: 0 10px 20px rgba(0,0,0,.3); transform: scale(1.15); }

  .exit-btn {
    position: absolute; top: 14px; left: 14px; border: none; border-radius: 999px;
    background: rgba(255,255,255,.85); color: #6b4226; font-weight: 700; font-size: 14px; padding: 9px 16px; z-index: 15;
  }
  .exit-btn:active { transform: scale(.95); }

  .wait-bar-thin { position: fixed; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255,255,255,.12); z-index: 50; display: none; }
  .wait-bar-thin.show { display: block; }
  .wait-bar-thin-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #22d3ee, #a855f7, #ff3d9a); transition: width .5s linear; }
  .wait-bar-thin-fill.gold { background: linear-gradient(90deg, #ffd700, #fff3b0, #ffb703); }
</style>
</head>
<body>

<div class="rotate-overlay" id="rotate-overlay">
  <div class="rotate-icon">📱</div>
  <p>Bitte drehe dein Gerät ins Querformat, um zu spielen.</p>
</div>

<button class="fs-btn" id="fs-btn" type="button">⛶ Vollbild</button>

<div id="app">
  <div class="scene active" id="scene-outdoor">
    <div id="outdoor-stage">
      <div class="map" id="map"></div>
      <svg class="leash-svg" id="leash-svg"><path id="leash-path" fill="none" stroke="#8a5a3a" stroke-width="3" stroke-linecap="round"/></svg>
      <div class="stick-sprite" id="stick" hidden>🥢</div>
      <div class="sprite player-sprite" id="player"></div>
      <div class="sprite dog-sprite" id="dog-outdoor"></div>
      <div class="toast" id="toast"></div>
    </div>
    <div class="joystick" id="joystick">
      <div class="joy-base" id="joy-base"><div class="joy-knob" id="joy-knob"></div></div>
    </div>
    <div class="action-buttons">
      <button class="action-btn" id="btn-pet" type="button">✋ Streicheln</button>
      <button class="action-btn" id="btn-fetch" type="button">🥢 Stöckchen</button>
    </div>
  </div>

  <div class="scene" id="scene-house">
    <div class="room-bg">
      <div class="room-wall"></div>
      <div class="room-floor"></div>
      <div class="window"></div>
      <div class="picture-frame"></div>
      <div class="couch drop-target" id="drop-couch"></div>
      <div class="basket drop-target" id="drop-basket"></div>
    </div>
    <button class="exit-btn" id="exit-house" type="button">🚪 Raus</button>
    <div class="stat-bars">
      <div class="stat">💧<div class="stat-track"><div class="stat-fill" id="stat-water"></div></div></div>
      <div class="stat">✨<div class="stat-track"><div class="stat-fill" id="stat-fur"></div></div></div>
      <div class="stat">🍖<div class="stat-track"><div class="stat-fill" id="stat-hunger"></div></div></div>
      <div class="stat">❤️<div class="stat-track"><div class="stat-fill" id="stat-love"></div></div></div>
    </div>
    <div class="dog-big" id="dog-house"></div>
    <div class="hearts-layer" id="hearts-layer"></div>
    <div class="items-tray">
      <div class="item" data-item="water" id="item-water">💧</div>
      <div class="item" data-item="brush" id="item-brush">🪮</div>
      <div class="item" data-item="snack" id="item-snack">🍖</div>
    </div>
  </div>
</div>

<div class="wait-bar-thin" id="wait-bar-thin"><div class="wait-bar-thin-fill" id="wait-bar-thin-fill"></div></div>

<script>
(function () {
  'use strict';

  /* ================= Bestell-Sammelbalken ================= */
  (function () {
    var KEY = 'mw-wait-order';
    var bar = document.getElementById('wait-bar-thin');
    var fill = document.getElementById('wait-bar-thin-fill');
    function tick() {
      var q;
      try { q = JSON.parse(localStorage.getItem(KEY)); } catch (e) { q = null; }
      if (!q || !q.length) { bar.classList.remove('show'); return; }
      bar.classList.add('show');
      var start = q[0].start, end = q[q.length - 1].end, now = Date.now();
      var pct = Math.max(0, Math.min(100, ((now - start) / (end - start)) * 100));
      fill.style.width = pct + '%';
      fill.classList.toggle('gold', now >= end);
    }
    tick(); setInterval(tick, 1000);
  })();

  /* ================= Vollbild + Orientierung ================= */
  function goFullscreen() {
    var el = document.documentElement;
    try {
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) req.call(el).catch(function () {});
    } catch (e) {}
    try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {}); } catch (e) {}
  }
  document.getElementById('fs-btn').addEventListener('click', goFullscreen);
  document.addEventListener('click', function once() { document.removeEventListener('click', once); goFullscreen(); }, { once: true });

  /* ================= Sound (Web Audio, dezent & einheitlich) ================= */
  var SFX = (function () {
    var ctx = null, master = null;
    function ensure() {
      if (ctx) return ctx;
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain(); master.gain.value = 0.35;
        master.connect(ctx.destination);
      } catch (e) {}
      return ctx;
    }
    function resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }
    function tone(freq, start, dur, type, peak) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0, start);
      g.gain.linearRampToValueAtTime(peak, start + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      o.connect(g); g.connect(master);
      o.start(start); o.stop(start + dur + 0.05);
    }
    function noise(start, dur, peak, freq) {
      var bufSize = Math.floor(ctx.sampleRate * dur);
      var buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
      var src = ctx.createBufferSource(); src.buffer = buf;
      var g = ctx.createGain(), filt = ctx.createBiquadFilter();
      filt.type = 'bandpass'; filt.frequency.value = freq || 1200;
      g.gain.setValueAtTime(0, start);
      g.gain.linearRampToValueAtTime(peak, start + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      src.connect(filt); filt.connect(g); g.connect(master);
      src.start(start); src.stop(start + dur + 0.02);
    }
    function play(name) {
      if (!ensure()) return;
      resume();
      var t = ctx.currentTime;
      if (name === 'step') tone(220 + Math.random() * 30, t, 0.06, 'sine', 0.05);
      else if (name === 'splash') noise(t, 0.18, 0.12, 900);
      else if (name === 'pet') { tone(660, t, 0.18, 'sine', 0.12); tone(880, t + 0.08, 0.2, 'sine', 0.1); }
      else if (name === 'dig') noise(t, 0.3, 0.08, 400);
      else if (name === 'bone') { tone(880, t, 0.12, 'triangle', 0.12); tone(1320, t + 0.09, 0.18, 'triangle', 0.12); }
      else if (name === 'throw') noise(t, 0.22, 0.1, 2200);
      else if (name === 'grab') tone(500, t, 0.1, 'square', 0.08);
      else if (name === 'happy') { tone(523, t, 0.15, 'triangle', 0.12); tone(659, t + 0.1, 0.15, 'triangle', 0.12); tone(784, t + 0.2, 0.22, 'triangle', 0.12); }
      else if (name === 'drop') tone(200, t, 0.15, 'sine', 0.1);
      else if (name === 'wake') tone(440, t, 0.12, 'sine', 0.1);
    }
    return { play: play };
  })();

  /* ================= Kartendaten ================= */
  var MAP = [
    'FFFFFFFFFF',
    'FGGGTGGGGF',
    'FGGGGGWWGF',
    'FGHHGGWPGF',
    'FGDHGGGTGF',
    'FFFFFFFFFF'
  ];
  var ROWS = MAP.length, COLS = MAP[0].length;
  var DOOR = { x: 2, y: 4 };
  var BLOCKED = { F: 1, T: 1, W: 1, H: 1 };

  var mapEl = document.getElementById('map');
  var stage = document.getElementById('outdoor-stage');
  var playerEl = document.getElementById('player');
  var dogOutEl = document.getElementById('dog-outdoor');
  var leashPath = document.getElementById('leash-path');
  var toastEl = document.getElementById('toast');
  var TILE = 48;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove('show'); }, 1600);
  }

  /* ---- Detailliertere SVG-Illustrationen (Gradients für mehr Tiefe) ---- */
  var DEFS =
    '<defs>' +
    '<radialGradient id="gCanopy" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#8fd47f"/><stop offset="100%" stop-color="#3f8f3a"/></radialGradient>' +
    '<linearGradient id="gTrunk" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8a5a3a"/><stop offset="100%" stop-color="#6b4226"/></linearGradient>' +
    '<linearGradient id="gRoof" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e07360"/><stop offset="100%" stop-color="#b4453a"/></linearGradient>' +
    '<linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fbe8c2"/><stop offset="100%" stop-color="#eccb95"/></linearGradient>' +
    '<radialGradient id="gHair" cx="35%" cy="25%" r="75%"><stop offset="0%" stop-color="#7a4a2b"/><stop offset="100%" stop-color="#5a3319"/></radialGradient>' +
    '<radialGradient id="gDress" cx="35%" cy="20%" r="80%"><stop offset="0%" stop-color="#ff9ec4"/><stop offset="100%" stop-color="#e8639c"/></radialGradient>' +
    '<radialGradient id="gSkin" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#ffe3c2"/><stop offset="100%" stop-color="#f0c398"/></radialGradient>' +
    '<radialGradient id="gFur" cx="35%" cy="25%" r="80%"><stop offset="0%" stop-color="#f0c58a"/><stop offset="100%" stop-color="#c9924f"/></radialGradient>' +
    '<radialGradient id="gRiver" cx="40%" cy="30%" r="80%"><stop offset="0%" stop-color="#9fe6f5"/><stop offset="100%" stop-color="#3f9fbf"/></radialGradient>' +
    '</defs>';

  function svgTree() {
    var oc = '#2e5a2a';
    return '<svg viewBox="0 0 48 56">' + DEFS +
      '<ellipse cx="24" cy="50" rx="10" ry="3" fill="rgba(0,0,0,.18)"/>' +
      '<rect x="20" y="30" width="8" height="18" rx="3" fill="url(#gTrunk)" stroke="#4a2f1a" stroke-width="1"/>' +
      '<circle cx="24" cy="20" r="16" fill="url(#gCanopy)" stroke="' + oc + '" stroke-width="1.4"/>' +
      '<circle cx="14" cy="26" r="10" fill="url(#gCanopy)" stroke="' + oc + '" stroke-width="1.2"/>' +
      '<circle cx="34" cy="26" r="10" fill="url(#gCanopy)" stroke="' + oc + '" stroke-width="1.2"/>' +
      '<circle cx="18" cy="14" r="4" fill="#fff" opacity=".25"/>' +
      '</svg>';
  }
  function svgHouse() {
    return '<svg viewBox="0 0 100 100">' + DEFS +
      '<polygon points="50,4 96,42 4,42" fill="url(#gRoof)"/>' +
      '<rect x="4" y="40" width="92" height="2" fill="#8a3a2f"/>' +
      '<rect x="16" y="40" width="68" height="54" fill="url(#gWall)"/>' +
      '<rect x="42" y="62" width="18" height="32" fill="#8a5a3a" rx="3"/>' +
      '<circle cx="55" cy="78" r="1.6" fill="#f2dcae"/>' +
      '<rect x="22" y="52" width="16" height="16" fill="#bfe8f5" stroke="#fff" stroke-width="3"/>' +
      '<rect x="62" y="52" width="16" height="16" fill="#bfe8f5" stroke="#fff" stroke-width="3"/>' +
      '<rect x="76" y="10" width="8" height="16" fill="#8a5a3a"/>' +
      '<circle cx="24" cy="96" r="4" fill="#e07360" opacity=".8"/><circle cx="30" cy="96" r="4" fill="#e8639c" opacity=".8"/>' +
      '</svg>';
  }
  function svgPlayer() {
    /* Frau: Zopf, Kleid */
    var oc = '#5a3a1f', ow = 1.2;
    return '<svg viewBox="0 0 40 50">' + DEFS +
      '<ellipse cx="20" cy="46" rx="10" ry="3" fill="rgba(0,0,0,.2)"/>' +
      '<path d="M11 22c0 10 3 20 9 20s9-10 9-20z" fill="url(#gDress)" stroke="' + oc + '" stroke-width="' + ow + '"/>' +
      '<circle cx="20" cy="13" r="10.5" fill="url(#gSkin)" stroke="' + oc + '" stroke-width="' + ow + '"/>' +
      '<path d="M9.5 12a10.5 10.5 0 0 1 21 0c-1-1-3-4-10.5-4s-9.5 3-10.5 4z" fill="url(#gHair)" stroke="' + oc + '" stroke-width="1"/>' +
      '<path d="M28 14c3 1 4 6 2 9-1-3-1-6-2-9z" fill="url(#gHair)" stroke="' + oc + '" stroke-width="1"/>' +
      '<circle cx="16.5" cy="14" r="1.5" fill="#3a2a20"/><circle cx="23.5" cy="14" r="1.5" fill="#3a2a20"/>' +

  /* ---- virtueller Joystick ---- */
  (function () {
    var base = document.getElementById('joy-base');
    var knob = document.getElementById('joy-knob');
    var active = false, dir = null, timer = null;
    function doStep() {
      var m = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[dir];
      if (m) tryMove(m[0], m[1]);
    }
    function setDir(d) {
      if (d === dir) return;
      dir = d;
      clearInterval(timer);
      if (d) { doStep(); timer = setInterval(doStep, 230); }
    }
    function update(e) {
      var r = base.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var dx = e.clientX - cx, dy = e.clientY - cy;
      var dist = Math.min(Math.hypot(dx, dy), r.width / 2 - 8);
      var ang = Math.atan2(dy, dx);
      knob.style.transform = 'translate(' + (Math.cos(ang) * dist) + 'px,' + (Math.sin(ang) * dist) + 'px)';
      if (Math.hypot(dx, dy) < r.width * 0.18) { setDir(null); return; }
      var deg = ang * 180 / Math.PI;
      setDir(deg > -45 && deg <= 45 ? 'right' : deg > 45 && deg <= 135 ? 'down' : (deg > 135 || deg <= -135) ? 'left' : 'up');
    }
    base.addEventListener('pointerdown', function (e) { active = true; try { base.setPointerCapture(e.pointerId); } catch (err) {} update(e); });
    base.addEventListener('pointermove', function (e) { if (active) update(e); });

    dogHouseEl.addEventListener('pointercancel', finish);
  })();

  /* Pflege-Items per Drag (oder Tap) auf den Hund */
  document.querySelectorAll('.item').forEach(function (item) {
    var dragging = false, moved = false, clone = null;
    item.addEventListener('pointerdown', function (e) { dragging = true; moved = false; try { item.setPointerCapture(e.pointerId); } catch (err) {} });
    item.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      moved = true;
      if (!clone) { clone = item.cloneNode(true); clone.classList.add('dragging'); document.body.appendChild(clone); }
      clone.style.left = (e.clientX - 28) + 'px'; clone.style.top = (e.clientY - 28) + 'px';
    });
    function finish(e) {
      if (!dragging) return;
      dragging = false;
      var r = dogHouseEl.getBoundingClientRect();
      var hit = moved && e.clientX >= r.left - 20 && e.clientX <= r.right + 20 && e.clientY >= r.top - 20 && e.clientY <= r.bottom + 20;
      if (clone) { clone.remove(); clone = null; }
      if (hit || !moved) careAction(item.dataset.item);
    }
    item.addEventListener('pointerup', finish);
    item.addEventListener('pointercancel', function () { dragging = false; if (clone) { clone.remove(); clone = null; } });
  });

  /* ================= Größe anpassen ================= */
  function fitStage() {
    var vw = window.innerWidth, vh = window.innerHeight - 4;
    TILE = Math.max(24, Math.floor(Math.min(vw / COLS, vh / ROWS)));
    buildMap();
    renderDog();
    render();
  }
  window.addEventListener('resize', fitStage);
  document.getElementById('drop-couch').innerHTML = svgCouch();
  document.getElementById('drop-basket').innerHTML = svgBasket();
  fitStage();
  leashLoop();
})();
</script>
</body>
</html>
