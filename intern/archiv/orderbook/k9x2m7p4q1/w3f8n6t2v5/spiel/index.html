<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0f1f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pets">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<title>Pets</title>
<style>
  :root {
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --glass: rgba(18, 28, 22, .55);
    --glass-2: rgba(255, 255, 255, .14);
    --line: rgba(255, 255, 255, .22);
    --ink: #fff;
    --gold: #ffd166;
    --pink: #ff8fb8;
    --green: #6ee7a8;
    --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  html, body {
    position: fixed; inset: 0; margin: 0; overflow: hidden;
    width: 100%; height: 100%;
    background: #0f1f14; color: var(--ink); font-family: var(--font);
    overscroll-behavior: none; touch-action: none;
  }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  [hidden] { display: none !important; }

  /* ---------- Glas-Elemente ---------- */
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
    border: 1px solid var(--line);
    box-shadow: 0 8px 30px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 7px 13px; font-weight: 800; font-size: 14px; line-height: 1; white-space: nowrap; }
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; }
  .icon-btn:active, .pill-btn:active { transform: scale(.92); }
  #btn-quests.pulse-q { box-shadow: 0 0 0 0 rgba(255,209,102,.8); animation: qpulse 1.4s ease-out infinite; }
  @keyframes qpulse { to { box-shadow: 0 0 0 14px rgba(255,209,102,0); } }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #hud > * { pointer-events: auto; }
  .hud-tl { position: absolute; top: calc(10px + var(--safe-t)); left: calc(10px + var(--safe-l)); display: flex; gap: 8px; align-items: center; }
  .hud-tr { position: absolute; top: calc(10px + var(--safe-t)); right: calc(10px + var(--safe-r)); display: flex; gap: 8px; align-items: center; }
  .hud-tc { position: absolute; top: calc(10px + var(--safe-t)); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; pointer-events: none !important; }
  .bones-pill b { font-variant-numeric: tabular-nums; min-width: 1.4ch; text-align: right; }
  .bones-pill.bump { animation: bump .45s cubic-bezier(.3,1.6,.5,1); }
  @keyframes bump { 40% { transform: scale(1.25); } }
  .stats-mini { display: flex; gap: 10px; padding: 7px 12px; border-radius: 999px; }
  .sm { display: flex; align-items: center; gap: 5px; font-size: 13px; }
  .sm i { display: block; width: 34px; height: 6px; border-radius: 9px; background: rgba(255,255,255,.18); overflow: hidden; }
  .sm i b { display: block; height: 100%; width: 50%; border-radius: 9px; background: linear-gradient(90deg, #6ee7a8, #34d399); transition: width .4s ease; }
  .sm i b.low { background: linear-gradient(90deg, #ff8a5c, #ef4444); }
  .objective { padding: 8px 16px; font-size: 14px; }
  .timer { font-variant-numeric: tabular-nums; }
  .hearts { letter-spacing: 2px; }

  /* ---------- Joystick (schwebend: erscheint, wo der Daumen aufsetzt) ---------- */
  #joyzone { position: fixed; left: 0; bottom: 0; width: 46%; height: 70%; z-index: 9; touch-action: none; }
  #joystick { position: fixed; left: 0; top: 0; width: 128px; height: 128px; margin: -64px 0 0 -64px; z-index: 11; pointer-events: none; opacity: .55; transition: opacity .2s; }
  #joystick.active { opacity: 1; transition: none; }
  .joy-base { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.10), rgba(255,255,255,.04) 70%); border: 2px solid rgba(255,255,255,.35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .joy-knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #dfe9e3 70%); box-shadow: 0 6px 16px rgba(0,0,0,.35); }

  /* ---------- Aktionsknöpfe ---------- */
  #actions { position: fixed; right: calc(14px + var(--safe-r)); bottom: calc(14px + var(--safe-b)); z-index: 12; display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; gap: 10px; align-items: end; justify-items: end; }
  .act { position: relative; display: grid; place-items: center; border-radius: 50%; color: #fff; font-weight: 800; touch-action: none; transition: transform .12s, opacity .2s; }
  .act .ic { font-size: 24px; line-height: 1; }
  .act .lb { position: absolute; bottom: -2px; left: 50%; transform: translate(-50%, 100%); font-size: 11px; font-weight: 800; text-shadow: 0 1px 3px rgba(0,0,0,.6); white-space: nowrap; letter-spacing: .02em; }
  .act.sm { width: 58px; height: 58px; margin-bottom: 16px; }
  .act.lg { width: 84px; height: 84px; grid-row: 1 / span 2; grid-column: 2; margin-bottom: 16px; }
  .act.lg .ic { font-size: 34px; }
  .act.primary { background: radial-gradient(circle at 35% 25%, #ffe08a, #f5a623 65%, #d9800f); box-shadow: 0 8px 22px rgba(245,166,35,.45), inset 0 2px 0 rgba(255,255,255,.5), inset 0 -4px 0 rgba(0,0,0,.15); }
  .act.secondary { background: rgba(20,32,26,.55); border: 1.5px solid rgba(255,255,255,.35); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 6px 16px rgba(0,0,0,.3); }
  .act.pressed, .act:active { transform: scale(.9); }
  .act:disabled { opacity: .4; }
  .act.pulse::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid rgba(255,214,102,.8); animation: ring 1.2s ease-out infinite; }
  @keyframes ring { from { transform: scale(.9); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }

  /* ---------- Toast & Banner ---------- */
  #toast { position: fixed; left: 50%; top: calc(64px + var(--safe-t)); transform: translate(-50%, -10px); z-index: 30; opacity: 0; transition: opacity .25s, transform .3s cubic-bezier(.3,1.4,.5,1); pointer-events: none; padding: 10px 18px; font-size: 15px; max-width: 88vw; white-space: normal; text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #banner { position: fixed; inset: 0; display: grid; place-items: center; z-index: 31; pointer-events: none; }
  #banner span { font-size: clamp(54px, 14vmin, 120px); font-weight: 900; color: #fff; text-shadow: 0 6px 0 rgba(0,0,0,.18), 0 12px 40px rgba(0,0,0,.4); -webkit-text-stroke: 2px rgba(0,0,0,.08); opacity: 0; }
  #banner span.go { animation: bannerPop .9s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes bannerPop { 0% { opacity: 0; transform: scale(2.2); } 25% { opacity: 1; transform: scale(1); } 75% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.8); } }

  /* ---------- Modal ---------- */
  #modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: calc(16px + var(--safe-t)) calc(16px + var(--safe-r)) calc(16px + var(--safe-b)) calc(16px + var(--safe-l)); background: rgba(5,10,8,.45); opacity: 0; pointer-events: none; transition: opacity .25s; }
  #modal.show { opacity: 1; pointer-events: auto; }
  .card { width: min(460px, 100%); max-height: 100%; overflow: auto; border-radius: 26px; padding: 22px 22px 18px; background: linear-gradient(160deg, rgba(34,52,42,.92), rgba(16,26,20,.94)); border: 1px solid rgba(255,255,255,.18); box-shadow: 0 30px 80px rgba(0,0,0,.5); transform: translateY(14px) scale(.97); transition: transform .35s cubic-bezier(.2,1.3,.4,1); -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  #modal.show .card { transform: none; }
  .card h2 { margin: 0 0 4px; font-size: 24px; font-weight: 900; letter-spacing: -.01em; }
  .card p.sub { margin: 0 0 14px; color: rgba(255,255,255,.7); font-size: 14px; }
  .card .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .btn { flex: 1; min-height: 50px; border-radius: 16px; padding: 12px 16px; font-weight: 800; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:active { transform: scale(.96); }
  .btn.gold { background: linear-gradient(180deg, #ffd166, #f5a623); color: #3a2400; box-shadow: 0 6px 0 #c47a10; }
  .btn.ghost { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); }
  .stars { font-size: 44px; text-align: center; letter-spacing: 6px; margin: 6px 0 2px; }
  .stars .off { opacity: .2; filter: grayscale(1); }
  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .result-grid div { background: rgba(255,255,255,.07); border-radius: 14px; padding: 10px 12px; }
  .result-grid small { display: block; font-size: 12px; color: rgba(255,255,255,.6); }
  .result-grid b { font-size: 20px; }
  .list { display: grid; gap: 8px; margin-top: 6px; }
  .q { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; background: rgba(255,255,255,.07); border-radius: 16px; padding: 10px 12px; }
  .q .e { font-size: 24px; text-align: center; }
  .q small { display: block; color: rgba(255,255,255,.6); font-size: 12px; margin-top: 2px; }
  .q .bar { height: 6px; border-radius: 9px; background: rgba(255,255,255,.15); margin-top: 6px; overflow: hidden; }
  .q .bar b { display: block; height: 100%; background: linear-gradient(90deg, #ffd166, #f5a623); }
  .q.done { background: rgba(110,231,168,.14); }
  .tiny-btn { border-radius: 12px; padding: 8px 12px; font-weight: 800; font-size: 13px; background: linear-gradient(180deg, #ffd166, #f5a623); color: #3a2400; }
  .tiny-btn:disabled { background: rgba(255,255,255,.12); color: rgba(255,255,255,.5); }
  .wardrobe { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ward { border-radius: 16px; padding: 10px 6px 8px; background: rgba(255,255,255,.07); border: 2px solid transparent; text-align: center; font-size: 12px; font-weight: 700; }
  .ward canvas { width: 70px; height: 54px; display: block; margin: 0 auto 4px; }
  .ward.on { border-color: var(--gold); background: rgba(255,209,102,.14); }
  .ward .price { color: var(--gold); }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px; border-bottom: 1px solid rgba(255,255,255,.1); font-weight: 700; }
  .switch { width: 52px; height: 30px; border-radius: 99px; background: rgba(255,255,255,.18); position: relative; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .25s cubic-bezier(.3,1.4,.5,1); }
  .switch.on { background: #34d399; }
  .switch.on::after { transform: translateX(22px); }
  .name-input { width: 100%; font: inherit; font-size: 20px; font-weight: 800; padding: 12px 14px; border-radius: 14px; border: 2px solid rgba(255,255,255,.2); background: rgba(0,0,0,.25); color: #fff; outline: none; user-select: text; -webkit-user-select: text; touch-action: manipulation; }
  .name-input:focus { border-color: var(--gold); }

  /* ---------- Haus-UI ---------- */
  #house-ui { position: fixed; inset: 0; z-index: 12; pointer-events: none; }
  #house-ui > * { pointer-events: auto; }
  .care-bars { position: absolute; top: calc(62px + var(--safe-t)); left: calc(12px + var(--safe-l)); display: grid; gap: 7px; padding: 12px 14px; border-radius: 20px; min-width: 170px; }
  .cb { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: center; font-size: 15px; }
  .cb i { display: block; height: 9px; border-radius: 9px; background: rgba(255,255,255,.16); overflow: hidden; }
  .cb i b { display: block; height: 100%; border-radius: 9px; background: linear-gradient(90deg, #6ee7a8, #22c55e); transition: width .5s cubic-bezier(.3,1.3,.5,1); }
  .cb i b.low { background: linear-gradient(90deg, #ffb35c, #ef4444); }
  .mood { font-size: 12px; font-weight: 800; color: rgba(255,255,255,.8); margin-top: 2px; }
  .tray { position: absolute; left: 50%; bottom: calc(12px + var(--safe-b)); transform: translateX(-50%); display: flex; gap: 10px; padding: 10px; border-radius: 24px; }
  .item { width: 62px; height: 62px; border-radius: 18px; display: grid; place-items: center; font-size: 30px; background: rgba(255,255,255,.92); box-shadow: 0 5px 0 rgba(0,0,0,.18); touch-action: none; position: relative; }
  .item small { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #fff; font-weight: 800; text-shadow: 0 1px 3px rgba(0,0,0,.6); white-space: nowrap; }
  .item.drag-ghost { position: fixed; z-index: 99; pointer-events: none; transform: scale(1.18) rotate(-6deg); box-shadow: 0 16px 30px rgba(0,0,0,.35); margin: -31px 0 0 -31px; }
  .house-right { position: absolute; top: calc(62px + var(--safe-t)); right: calc(12px + var(--safe-r)); display: grid; gap: 8px; justify-items: end; }
  .pill-btn { border-radius: 999px; padding: 10px 14px; font-weight: 800; font-size: 14px; }

  /* ---------- Titelbildschirm ---------- */
  #title { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; text-align: center; padding: 20px; background: radial-gradient(ellipse at 50% 120%, rgba(0,0,0,.55), transparent 60%), linear-gradient(180deg, rgba(10,20,14,.15), rgba(10,20,14,.55)); transition: opacity .6s; }
  #title.out { opacity: 0; pointer-events: none; }
  .logo { font-size: clamp(64px, 18vmin, 150px); font-weight: 900; letter-spacing: -.02em; line-height: 1; color: #fff; animation: logoIn 1s cubic-bezier(.2,1.4,.4,1) both; }
  .logo span { display: inline-block; color: #fff8e6; text-shadow: 0 5px 0 #f5a623, 0 9px 0 rgba(0,0,0,.2), 0 18px 40px rgba(0,0,0,.45); animation: wob 2.8s ease-in-out infinite; }
  .logo span:nth-child(2) { animation-delay: .15s; } .logo span:nth-child(3) { animation-delay: .3s; } .logo span:nth-child(4) { animation-delay: .45s; }
  @keyframes wob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-6px) rotate(-2deg); } }
  @keyframes logoIn { from { opacity: 0; transform: scale(.6) translateY(30px); } }
  .tagline { margin: 10px 0 22px; font-size: 16px; font-weight: 700; color: rgba(255,255,255,.85); text-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .start-btn { min-width: 220px; min-height: 60px; border-radius: 20px; font-size: 20px; font-weight: 900; background: linear-gradient(180deg, #ffd166, #f5a623); color: #3a2400; box-shadow: 0 8px 0 #c47a10, 0 20px 40px rgba(0,0,0,.35); animation: logoIn 1s .2s cubic-bezier(.2,1.4,.4,1) both; }
  .start-btn:active { transform: translateY(5px); box-shadow: 0 3px 0 #c47a10; }
  .title-foot { position: absolute; bottom: calc(14px + var(--safe-b)); left: 0; right: 0; font-size: 12px; color: rgba(255,255,255,.55); font-weight: 700; }
  .title-back { position: absolute; top: calc(12px + var(--safe-t)); right: calc(12px + var(--safe-r)); }

  /* ---------- Bestell-Sammelbalken ---------- */
  .wait-bar-thin { position: fixed; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(255,255,255,.12); z-index: 60; display: none; }
  .wait-bar-thin.show { display: block; }
  .wait-bar-thin-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #22d3ee, #a855f7, #ff3d9a); transition: width .5s linear; }
  .wait-bar-thin-fill.gold { background: linear-gradient(90deg, #ffd700, #fff3b0, #ffb703); }

  @media (max-height: 420px) {
    .act.lg { width: 74px; height: 74px; } .act.sm { width: 52px; height: 52px; }
    .care-bars { padding: 9px 12px; gap: 5px; min-width: 150px; }
    .item { width: 54px; height: 54px; font-size: 26px; }
    .stats-mini { display: none; }
  }
  @media (orientation: portrait) {
    #joyzone { width: 60%; height: 55%; }
    .stats-mini { display: none; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-tl">
    <button class="icon-btn glass" id="btn-menu" type="button" aria-label="Menü">⚙︎</button>
    <button class="pill glass pill-btn" id="btn-exit" type="button" hidden>✕ Verlassen</button>
  </div>
  <div class="hud-tc">
    <div class="stats-mini glass" id="stats-mini">
      <span class="sm">❤️<i><b id="sm-love"></b></i></span>
      <span class="sm">🍖<i><b id="sm-hunger"></b></i></span>
      <span class="sm">💧<i><b id="sm-water"></b></i></span>
      <span class="sm">✨<i><b id="sm-fur"></b></i></span>
    </div>
    <div class="pill glass objective" id="objective" hidden></div>
  </div>
  <div class="hud-tr">
    <span class="pill glass" id="hud-extra" hidden></span>
    <span class="pill glass bones-pill" id="bones-pill">🦴 <b id="bones">0</b></span>
    <button class="icon-btn glass" id="btn-quests" type="button" aria-label="Aufgaben">📜</button>
  </div>
</div>

<div id="joyzone"></div>
<div id="joystick"><div class="joy-base"></div><div class="joy-knob" id="joy-knob"></div></div>
<div id="actions"></div>

<div id="house-ui" hidden>
  <div class="care-bars glass">
    <div class="cb">❤️<i><b id="cb-love"></b></i></div>
    <div class="cb">🍖<i><b id="cb-hunger"></b></i></div>
    <div class="cb">💧<i><b id="cb-water"></b></i></div>
    <div class="cb">✨<i><b id="cb-fur"></b></i></div>
    <div class="cb">⚡<i><b id="cb-energy"></b></i></div>
    <div class="mood" id="mood"></div>
  </div>
  <div class="house-right">
    <button class="pill glass pill-btn" id="btn-wardrobe" type="button">🎀 Garderobe</button>
  </div>
  <div class="tray glass" id="tray">
    <div class="item" data-item="snack">🍖<small>Futter</small></div>
    <div class="item" data-item="water">💧<small>Wasser</small></div>
    <div class="item" data-item="brush">🪮<small>Bürste</small></div>
    <div class="item" data-item="ball">🎾<small>Ball</small></div>
  </div>
</div>

<div id="toast" class="glass pill"></div>
<div id="banner"><span id="banner-text"></span></div>
<div id="modal"><div class="card" id="modal-card"></div></div>

<div id="title">
  <button class="pill glass pill-btn title-back" id="title-back" type="button">↩ Bestellliste</button>
  <div>
    <div class="logo" aria-label="Pets"><span>P</span><span>e</span><span>t</span><span>s</span></div>
    <div class="tagline" id="tagline">Gassi gehen, spielen, kuscheln.</div>
    <button class="start-btn" id="start-btn" type="button">Los geht's 🐾</button>
  </div>
  <div class="title-foot">Tipp: Am Handy im Querformat spielen · Ton an für das volle Erlebnis</div>
</div>

<div class="wait-bar-thin" id="wait-bar-thin"><div class="wait-bar-thin-fill" id="wait-bar-thin-fill"></div></div>

<script src="js/core.js"></script>
<script src="js/art.js"></script>
<script src="js/hub.js"></script>
<script src="js/house.js"></script>
<script src="js/maze.js"></script>
<script src="js/runner.js"></script>
<script src="js/fishing.js"></script>
<script src="js/race.js"></script>
<script src="js/main.js"></script>
</body>
</html>
